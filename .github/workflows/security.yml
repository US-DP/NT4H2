name: CI - Seguridad (secretos + dependencias)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Semanal: las CVEs nuevas afectan a lockfiles sin cambios
    - cron: '17 4 * * 1'

jobs:
  secrets:
    name: 'Escaneo de secretos (gitleaks)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks-action@v2 exige licencia de pago en repos de
      # organización; el binario OSS es libre — se instala fijado.
      - name: Instalar gitleaks
        run: |
          VERSION=8.30.1
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz
      - run: gitleaks git --verbose --redact .

  npm-audit:
    name: 'Auditoria dependencias npm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  pip-audit:
    name: 'Auditoria dependencias Python'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install pip-audit
      - name: pip-audit
        working-directory: apps/backend
        run: pip-audit -r requirements.txt

  # Solo en PR: compara el grafo de dependencias del PR contra main y
  # bloquea si el diff introduce paquetes con CVEs conocidas.
  dependency-review:
    name: 'Revisión de dependencias (PR)'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # SHA pineado (v5.0.0) — mismo pin que en vnc-remote-secure
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
