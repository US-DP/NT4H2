name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Semanal: reglas nuevas del motor pueden detectar problemas viejos
    - cron: '53 5 * * 3'

permissions:
  contents: read

jobs:
  analyze:
    name: 'CodeQL (${{ matrix.language }})'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # python: backend Django; javascript-typescript: engine/catalog/
        # schema/mobile/engine-runner (interpretado — sin build)
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
