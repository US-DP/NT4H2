name: CI - Motor de reglas NT4H

on:
  push:
    branches: [main, master]
    paths:
      - 'packages/**'
      - 'apps/engine-runner/**'
      - '.github/workflows/engine-ci.yml'
      # I-6: un cambio solo de dependencias/tooling debe re-correr el gate
      - 'pnpm-*.yaml'
      - 'package.json'
      - 'turbo.json'
  pull_request:
    branches: [main, master]
    paths:
      - 'packages/**'
      - 'apps/engine-runner/**'
      - '.github/workflows/engine-ci.yml'
      - 'pnpm-*.yaml'
      - 'package.json'
      - 'turbo.json'

jobs:
  # ===========================================================================
  # Capa 0: Typecheck + Build
  # ===========================================================================
  typecheck:
    name: 'Capa 0: Typecheck'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nt4h/engine typecheck
      - run: pnpm --filter @nt4h/schema typecheck
      - run: pnpm --filter @nt4h/catalog typecheck

  # ===========================================================================
  # Capa 0b: ESLint (seguridad + calidad TS — ratchet de warnings en scripts)
  # ===========================================================================
  lint:
    name: 'Capa 0b: ESLint engine/catalog/schema'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nt4h/engine lint
      - run: pnpm --filter @nt4h/schema lint
      - run: pnpm --filter @nt4h/catalog lint

  # ===========================================================================
  # Capa 1: Validacion estatica del catalogo (Nivel 0)
  # ===========================================================================
  catalog-validation:
    name: 'Capa 1: Validacion catalogo (Nivel 0)'
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nt4h/engine test -- --run tests/catalog/catalog-validation.test.ts
      # Tests del paquete catalog (carga, integridad, validación de sets)
      - run: pnpm --filter @nt4h/catalog test

  # ===========================================================================
  # Capa 2: Pruebas unitarias (Niveles 1-2)
  # ===========================================================================
  unit-tests:
    name: 'Capa 2: Unitarias (Niveles 1-2)'
    runs-on: ubuntu-latest
    needs: catalog-validation
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nt4h/engine test -- --run tests/unit/

  # ===========================================================================
  # Capa 3: Pruebas del motor (Nivel 3)
  # ===========================================================================
  engine-tests:
    name: 'Capa 3: Motor (Nivel 3)'
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nt4h/engine test -- --run tests/engine/

  # ===========================================================================
  # Capa 4: Pruebas por carta, heroes y escenarios (Niveles 4-6)
  # ===========================================================================
  card-tests:
    name: 'Capa 4: Cartas/Heroes/Escenarios (Niveles 4-6)'
    runs-on: ubuntu-latest
    needs: engine-tests
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nt4h/engine test -- --run tests/cards/ tests/heroes/ tests/scenarios/

  # ===========================================================================
  # Capa 5: Pruebas basadas en propiedades y metamórficas (Niveles 7-8)
  # ===========================================================================
  property-tests:
    name: 'Capa 5: Propiedades/Metamórficas (Niveles 7-8)'
    runs-on: ubuntu-latest
    needs: card-tests
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nt4h/engine test -- --run tests/properties/

  # ===========================================================================
  # Capa 6: Suite completa (regresión)
  # ===========================================================================
  full-suite:
    name: 'Capa 6: Suite completa'
    runs-on: ubuntu-latest
    needs: property-tests
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nt4h/engine test
      - name: Verificar conteo de tests
        run: |
          echo "Suite completa ejecutada. Verificar que todos los tests pasan."

  # ===========================================================================
  # Capa 7: engine-runner (servicio HTTP del motor)
  # ===========================================================================
  runner-tests:
    name: 'Capa 7: Engine Runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nt4h/engine-runner typecheck
      - run: pnpm --filter @nt4h/engine-runner test

  # ===========================================================================
  # Capa 8: imagen Docker del engine-runner (I-4: el build de la
  # imagen no pasaba por ningun gate; el parche de expo-image rompia
  # el `pnpm install` dentro del contenedor sin que CI lo detectara)
  # ===========================================================================
  docker-runner:
    name: 'Capa 8: Docker build (engine-runner)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/engine-runner/Dockerfile -t nt4h-engine-runner:ci .
