version: 2

# Dependabot semanal: dependencias npm (workspace), pip (backend),
# imágenes Docker y acciones de GitHub. Las PRs pasan por los gates de CI
# igual que cualquier cambio.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      pnpm-workspace:
        # Solo minor+patch agrupados: un major de toolchain (typescript 7,
        # eslint 10, expo SDK…) envenenaba los ~60 bumps sanos del grupo —
        # los majors llegan como PRs individuales evaluables (PR #18).
        update-types: ["minor", "patch"]
        patterns: ["*"]
    ignore:
      # Los paquetes expo-* / react-native* van acoplados a la versión del
      # Expo SDK (~53): cualquier bump suelto (RN 0.x cuenta como "minor"
      # para semver pero es major de facto) instala APIs de SDKs futuros
      # y rompe la app aunque typecheck pase. Se actualizan juntos en una
      # migración de SDK dedicada.
      - dependency-name: "expo-*"
      - dependency-name: "react-native*"
      - dependency-name: "@react-native*"
      - dependency-name: "@shopify/react-native-skia"

  - package-ecosystem: pip
    directory: /apps/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /apps/engine-runner
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
