target-version = "py311"
line-length = 120
# Migraciones generadas: el estilo lo fija Django, no el proyecto
# (alineado con .flake8, que ya las excluye).
exclude = ["**/migrations/**", ".venv/**"]

[lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
]
ignore = [
  "E501",  # line too long (handled by formatter)
  "B008",  # do not perform function call in argument (Django pattern)
]
